services:
  soy-pacifico:
    build:
      context: .
      dockerfile: Dockerfile
    image: soy-pacifico-landing:latest
    container_name: soy-pacifico-web
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
